services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:15-alpine
    container_name: bpo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bpo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bpodb}
    ports:
      - "5433:5432" # host 5433 → container 5432 (avoids local PG conflict)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpo_user} -d ${POSTGRES_DB:-bpodb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bpo-net
    restart: unless-stopped

  # ── MCP Server ──
  # Isolated microservice for external tool execution (Google Sheets, Gmail, PII redaction)
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: bpo-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_TOKEN_PATH=/app/token.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8001),2); s.close()" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bpo-net
    restart: unless-stopped

  # ── Backend ──
  # FastAPI + CrewAI orchestration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bpo-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8001
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      - OPENAI_API_BASE=${LITELLM_BASE_URL}
      - GEMINI_API_KEY=${LITELLM_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bpo_user}:${POSTGRES_PASSWORD:-bpo_pass}@db:5432/${POSTGRES_DB:-bpodb}
      - CREWAI_TELEMETRY_OPT_OUT=true
      - CREWAI_TRACING_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
    networks:
      - bpo-net
    restart: unless-stopped

  # ── Frontend ──
  # React (Vite) operations cockpit
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bpo-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bpo-net
    restart: unless-stopped

networks:
  bpo-net:
    driver: bridge

volumes:
  postgres_data:
